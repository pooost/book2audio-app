[project]
name = "book2audio"
version = "0.1.0"
description = "Convert ebooks and text files to audio using TTS"
requires-python = ">=3.9"
dependencies = [
    "edge-tts>=6.1.0",
    "click>=8.1.0",
    "pydub>=0.25.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
    "pypdf>=4.0.0",
    "audioop-lts; python_version >= '3.13'",
]

[project.scripts]
book2audio = "book2audio.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
