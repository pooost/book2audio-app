[project]
name = "book2audio"
version = "0.1.0"
description = "Convert books (PDF/EPUB/scans) to narrated .m4b audiobooks"
requires-python = ">=3.11,<3.12"
dependencies = [
    "markitdown[all]",
    "openocr-python==0.1.5",
    # PyPI's chatterbox-tts (0.1.7) doesn't yet expose t3_model="v3" -- that
    # only exists on GitHub main. Track git until a release picks it up.
    "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git",
    "pymupdf",
    "ebooklib",
    "beautifulsoup4",
    "lxml",
    "soundfile",
    "mutagen",
    "pillow",
    "kokoro",  # fast/lightweight local TTS backend, alongside chatterbox-tts
    "typer",
    "rich",
    "PySide6",
]

[project.scripts]
book2audio = "book2audio.cli:main"
book2audio-gui = "book2audio.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
